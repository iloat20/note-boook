<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tab Icons Preview</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #F5F5F7;
    margin: 0;
    padding: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }
  h2 { color: #1D1D1F; margin-bottom: 20px; }

  .preview-section {
    background: #fff;
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }

  /* Tab bar 模拟 */
  .tab-bar-mock {
    display: flex;
    gap: 40px;
    padding: 16px 32px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
  }
  .tab-item-mock {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 16px;
    border-radius: 12px;
    transition: background 0.2s;
  }
  .tab-item-mock.active {
    background: rgba(0,0,0,0.04);
  }
  .tab-icon-mock {
    width: 48px;
    height: 48px;
  }
  .tab-text-mock {
    font-size: 12px;
    color: #86868B;
    font-weight: 400;
  }
  .tab-item-mock.active .tab-text-mock {
    color: #1D1D1F;
    font-weight: 600;
  }

  /* 图标并列展示 */
  .icon-showcase {
    display: flex;
    gap: 48px;
    align-items: flex-end;
  }
  .icon-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .icon-label {
    font-size: 13px;
    color: #86868B;
    font-weight: 500;
  }
  .icon-pair {
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .icon-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .icon-box svg {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    padding: 12px;
  }
  .icon-box .state-label {
    font-size: 11px;
    color: #AEAEB2;
  }
  .icon-box.active svg {
    background: rgba(0,0,0,0.03);
  }
  .icon-box.active .state-label {
    color: #1D1D1F;
    font-weight: 600;
  }
</style>
</head>
<body>

  <div class="preview-section">
    <h2>🦞 新 Tab 图标预览 — Liquid Glass 风格</h2>

    <!-- 模拟 Tab Bar -->
    <div class="tab-bar-mock">
      <div class="tab-item-mock active">
        <div class="tab-icon-mock">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
            <path d="M8 36L18 20L28 26L40 10" stroke="#1D1D1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="18" cy="20" r="3" fill="#1D1D1F"/>
            <circle cx="28" cy="26" r="3" fill="#1D1D1F"/>
            <circle cx="40" cy="10" r="3" fill="#1D1D1F"/>
          </svg>
        </div>
        <span class="tab-text-mock">持仓</span>
      </div>
      <div class="tab-item-mock">
        <div class="tab-icon-mock">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
            <circle cx="14" cy="12" r="3" fill="#86868B"/>
            <line x1="20" y1="12" x2="40" y2="12" stroke="#86868B" stroke-width="3" stroke-linecap="round"/>
            <circle cx="14" cy="24" r="3" fill="#86868B"/>
            <line x1="20" y1="24" x2="36" y2="24" stroke="#86868B" stroke-width="3" stroke-linecap="round"/>
            <circle cx="14" cy="36" r="3" fill="#86868B"/>
            <line x1="20" y1="36" x2="32" y2="36" stroke="#86868B" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="tab-text-mock">流水</span>
      </div>
      <div class="tab-item-mock">
        <div class="tab-icon-mock">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
            <rect x="10" y="22" width="8" height="20" rx="2" fill="#86868B"/>
            <rect x="20" y="12" width="8" height="30" rx="2" fill="#86868B"/>
            <rect x="30" y="17" width="8" height="25" rx="2" fill="#86868B"/>
          </svg>
        </div>
        <span class="tab-text-mock">统计</span>
      </div>
    </div>
  </div>

  <!-- 图标细节展示 -->
  <div class="preview-section">
    <h2>图标细节</h2>
    <div class="icon-showcase">

      <div class="icon-group">
        <span class="icon-label">📈 持仓</span>
        <div class="icon-pair">
          <div class="icon-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 48 48" fill="none">
              <path d="M8 36L18 20L28 26L40 10" stroke="#86868B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="18" cy="20" r="3" fill="#86868B"/>
              <circle cx="28" cy="26" r="3" fill="#86868B"/>
              <circle cx="40" cy="10" r="3" fill="#86868B"/>
            </svg>
            <span class="state-label">普通态</span>
          </div>
          <div class="icon-box active">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 48 48" fill="none">
              <path d="M8 36L18 20L28 26L40 10" stroke="#1D1D1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="18" cy="20" r="3" fill="#1D1D1F"/>
              <circle cx="28" cy="26" r="3" fill="#1D1D1F"/>
              <circle cx="40" cy="10" r="3" fill="#1D1D1F"/>
            </svg>
            <span class="state-label">选中态</span>
          </div>
        </div>
      </div>

      <div class="icon-group">
        <span class="icon-label">📋 流水</span>
        <div class="icon-pair">
          <div class="icon-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 48 48" fill="none">
              <circle cx="14" cy="12" r="3" fill="#86868B"/>
              <line x1="20" y1="12" x2="40" y2="12" stroke="#86868B" stroke-width="3" stroke-linecap="round"/>
              <circle cx="14" cy="24" r="3" fill="#86868B"/>
              <line x1="20" y1="24" x2="36" y2="24" stroke="#86868B" stroke-width="3" stroke-linecap="round"/>
              <circle cx="14" cy="36" r="3" fill="#86868B"/>
              <line x1="20" y1="36" x2="32" y2="36" stroke="#86868B" stroke-width="3" stroke-linecap="round"/>
            </svg>
            <span class="state-label">普通态</span>
          </div>
          <div class="icon-box active">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 48 48" fill="none">
              <circle cx="14" cy="12" r="3" fill="#1D1D1F"/>
              <line x1="20" y1="12" x2="40" y2="12" stroke="#1D1D1F" stroke-width="3" stroke-linecap="round"/>
              <circle cx="14" cy="24" r="3" fill="#1D1D1F"/>
              <line x1="20" y1="24" x2="36" y2="24" stroke="#1D1D1F" stroke-width="3" stroke-linecap="round"/>
              <circle cx="14" cy="36" r="3" fill="#1D1D1F"/>
              <line x1="20" y1="36" x2="32" y2="36" stroke="#1D1D1F" stroke-width="3" stroke-linecap="round"/>
            </svg>
            <span class="state-label">选中态</span>
          </div>
        </div>
      </div>

      <div class="icon-group">
        <span class="icon-label">📊 统计</span>
        <div class="icon-pair">
          <div class="icon-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 48 48" fill="none">
              <rect x="10" y="22" width="8" height="20" rx="2" fill="#86868B"/>
              <rect x="20" y="12" width="8" height="30" rx="2" fill="#86868B"/>
              <rect x="30" y="17" width="8" height="25" rx="2" fill="#86868B"/>
            </svg>
            <span class="state-label">普通态</span>
          </div>
          <div class="icon-box active">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 48 48" fill="none">
              <rect x="10" y="22" width="8" height="20" rx="2" fill="#1D1D1F"/>
              <rect x="20" y="12" width="8" height="30" rx="2" fill="#1D1D1F"/>
              <rect x="30" y="17" width="8" height="25" rx="2" fill="#1D1D1F"/>
            </svg>
            <span class="state-label">选中态</span>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
