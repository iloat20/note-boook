  <line x1="16" y1="14" x2="16" y2="34" stroke="#E5E5EA" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 节点 -->
  <circle cx="16" cy="16" r="3" fill="#FF3B30"/>
  <circle cx="16" cy="16" r="1.2" fill="white"/>
  <circle cx="16" cy="24" r="3" fill="#1C1C1E"/>
  <circle cx="16" cy="24" r="1.2" fill="white"/>
  <circle cx="16" cy="32" r="3" fill="#34C759"/>
  <circle cx="16" cy="32" r="1.2" fill="white"/>
  <!-- 内容条 -->
  <rect x="22" y="14" width="14" height="3" rx="1.5" fill="#1C1C1E" opacity="0.8"/>
  <rect x="22" y="19" width="8" height="2" rx="1" fill="#C7C7CC"/>
  <rect x="22" y="22" width="14" height="3" rx="1.5" fill="#1C1C1E" opacity="0.8"/>
  <rect x="22" y="27" width="10" height="2" rx="1" fill="#C7C7CC"/>
  <rect x="22" y="30" width="14" height="3" rx="1.5" fill="#1C1C1E" opacity="0.8"/>
  <rect x="22" y="35" width="6" height="2" rx="1" fill="#C7C7CC"/>
</svg>
