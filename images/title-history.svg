  <!-- 内部横线 -->
  <line x1="20" y1="16" x2="28" y2="16" stroke="url(#goldStroke)" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="22" x2="28" y2="22" stroke="url(#goldStroke)" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="28" x2="25" y2="28" stroke="url(#goldStroke)" stroke-width="3" stroke-linecap="round"/>
</svg>
