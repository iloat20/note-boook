<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 资产页标题图标 - 淡金色 iOS 线性图标 · 圆环饼图 -->
  <defs>
    <linearGradient id="goldStroke" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8CE8A"/>
      <stop offset="100%" stop-color="#C2A04E"/>
    </linearGradient>
  </defs>
  <!-- 底层浅金圆环 -->
  <circle cx="24" cy="24" r="14" stroke="#EDE2C4" stroke-width="4" stroke-linecap="round"/>
  <!-- 占比高亮弧 -->
  <circle cx="24" cy="24" r="14" stroke="url(#goldStroke)" stroke-width="4" stroke-linecap="round" stroke-dasharray="58 30" transform="rotate(-90 24 24)"/>
  <!-- 中心金点 -->
  <circle cx="24" cy="24" r="3.4" fill="url(#goldStroke)"/>
</svg>
