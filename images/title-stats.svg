<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 统计页标题图标 - 淡金色 iOS 线性图标 · 柱状图 -->
  <defs>
    <linearGradient id="goldStroke" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8CE8A"/>
      <stop offset="100%" stop-color="#C2A04E"/>
    </linearGradient>
  </defs>
  <!-- 基线 -->
  <line x1="12" y1="38" x2="36" y2="38" stroke="url(#goldStroke)" stroke-width="3" stroke-linecap="round"/>
  <!-- 递增柱 -->
  <rect x="15" y="25" width="5" height="13" rx="2.5" stroke="url(#goldStroke)" stroke-width="3"/>
  <rect x="22" y="17" width="5" height="21" rx="2.5" stroke="url(#goldStroke)" stroke-width="3"/>
  <rect x="29" y="11" width="5" height="27" rx="2.5" stroke="url(#goldStroke)" stroke-width="3"/>
</svg>
